[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb-error.log

[program:x11vnc]
command=x11vnc -display :0 -rfbauth /root/.vnc/passwd -rfbport 5900 -forever -shared -wait 50 -noxdamage
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc-error.log
depends=xvfb

[program:app]
command=python main.py
directory=/app
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/app.log
stderr_logfile=/var/log/app-error.log
depends=xvfb
environment=DISPLAY=":0",QT_QPA_PLATFORM="xcb"
